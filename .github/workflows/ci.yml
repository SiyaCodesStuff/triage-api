name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://triage:triage@localhost:5432/triage
      TEST_DATABASE_URL: postgres://triage:triage@localhost:5432/triage_test
      JWT_ACCESS_SECRET: test-access-secret-that-is-long-enough
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-different
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Create integration test database
        run: createdb -h localhost -p 5432 -U triage triage_test
        env:
          PGPASSWORD: triage
      - run: npm run db:migrate:test
      - run: npm run test:integration
      - run: npm run build
