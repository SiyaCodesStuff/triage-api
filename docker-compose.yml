x-api-common: &api-common
  image: triage-api:local
  build:
    context: .
    target: runtime
  profiles: ["full"]
  environment:
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage}@postgres:5432/${POSTGRES_DB:-triage}}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
    REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    TRUST_PROXY: ${TRUST_PROXY:-0}
    ENABLE_DOCS: ${ENABLE_DOCS:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api-common
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # A successful one-shot job has no long-running HTTP health endpoint.
    healthcheck:
      disable: true

  api:
    <<: *api-common
    init: true
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres_data:
